name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12"
          working-directory: backend
      - name: Install
        working-directory: backend
        run: uv sync
      - name: Test
        working-directory: backend
        run: uv run pytest -q
      - name: Lint
        working-directory: backend
        run: uvx ruff check .
      - name: Format
        working-directory: backend
        run: uvx ruff format --check .
      - name: Types
        working-directory: backend
        run: uv run mypy app

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Build
        working-directory: frontend
        run: npm run build
