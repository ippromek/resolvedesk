[project]
name = "resolvedesk"
version = "0.1.0"
description = "Complaint-resolution agent: LangGraph pipeline with a human approval gate"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite==3.1.1",
    "langchain>=1.0",
    "langchain-anthropic>=1.0",
    "langchain-openai>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "httpx>=0.28.1",
    "anthropic>=1.12.1",
    "openai>=3.26.1",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "mypy>=1.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
extend-select = ["I", "B", "UP", "SIM", "BLE", "RUF"]
# Arabic customer copy uses letters that RUF001 would rewrite as Latin.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
